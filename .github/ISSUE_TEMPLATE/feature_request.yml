name: Feature request
description: A use case Corbel does not serve yet.
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: Scenario
      description: Who asks, what they ask, and what a good answer looks like. docs/use-cases.md shows the format.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What Corbel does today
    validations:
      required: true
  - type: textarea
    id: measure
    attributes:
      label: How to measure it
      description: Which eval category or new questions would show the change helped. Optional.
